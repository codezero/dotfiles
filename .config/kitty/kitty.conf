# kitty.conf — kitty 0.48, Ubuntu GNOME on Wayland, zsh + powerlevel10k, nvim.
# Mirrors ~/.config/alacritty/alacritty.toml wherever the two overlap, then
# adds the kitty-only pieces (splits, hints, shell integration).
# ctrl+shift+f5 reloads; ctrl+shift+f6 dumps the effective config.

# ── Font ─────────────────────────────────────────────────────────────────
# Pinned on purpose: kitty ignores GNOME's monospace-font-name (step 55 sets
# that for the stock terminals only) and would fall back to fontconfig's
# "monospace" (DejaVu Sans Mono), which has none of the Nerd Font glyphs p10k
# draws — every icon was a box on the Gen-3 clone (found live 2026-09-13).
# MesloLGS NF is vendored in the repo: step 36 puts it in
# /usr/local/share/fonts/MesloLGS-NF, install.sh in ~/.local/share/fonts.
font_family      MesloLGS NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# ── Window ───────────────────────────────────────────────────────────────
remember_window_size  no
initial_window_width  100c
initial_window_height 60c
# alacritty pads in px (x=8, y=6); kitty pads in pt and lists vertical first.
# At 96 dpi 1pt = 1.33px, so 4.5pt/6pt lands on the same 6px/8px. (The first
# kitty.conf here wrote "6 8" as if these were px — a third wider than meant.)
window_padding_width  4.5 6
background_opacity    0.9
# background_blur needs a compositor with the KDE blur protocol; mutter has
# none, so it would be a no-op here (alacritty's blur = true is too).
# hide_window_decorations yes   # kitty's CSD on GNOME is plain; drop it if it grates

# ── Cursor / scrollback ──────────────────────────────────────────────────
cursor_shape          underline
# follow GNOME's cursor-blink setting
cursor_blink_interval -1
scrollback_lines      30000
# Lines scrolled per wheel tick (default 5.0)
wheel_scroll_multiplier 8.0

# Minimum lines per tick, so small swipes still move
wheel_scroll_min_lines 1

# ── Selection / clipboard ────────────────────────────────────────────────
# alacritty: selection.save_to_clipboard
copy_on_select        clipboard
strip_trailing_spaces smart
# OSC 52: nvim / tmux (incl. over SSH) may WRITE the clipboard, never read it —
# alacritty's osc52 = "OnlyCopy". kitty's default would still allow reads
# behind a prompt; leaving the read-* entries out refuses them outright.
clipboard_control write-clipboard write-primary

# ── Bell / mouse ─────────────────────────────────────────────────────────
# TUIs ring the bell constantly: no sound, no flash, no urgency hint. A bell in
# a background tab still gets a quiet marker on the tab.
enable_audio_bell    no
visual_bell_duration 0
window_alert_on_bell no
bell_on_tab          "🔔 "
# hide the pointer as soon as you type
mouse_hide_wait      -1

# ── Shell integration ────────────────────────────────────────────────────
# Default shell is $SHELL (zsh). Not a login shell, unlike alacritty's zsh -l,
# but nothing here depends on that: brew shellenv lives in .zshrc, ~/.zprofile
# doesn't exist.
# no-cursor: integration would otherwise flip the cursor to a beam at the
# prompt and override cursor_shape. Everything else stays on — ctrl+shift+z/x
# jump between prompts, ctrl+shift+g shows the last command's output, and new
# tabs/splits inherit the cwd.
shell_integration no-cursor
# Desktop notification when a command that ran >10s finishes in a window you
# can't currently see.
notify_on_cmd_finish invisible 10.0

# ── Tabs / splits ────────────────────────────────────────────────────────
# `splits` = arbitrary h/v splits; `stack` = zoom the focused split.
# ctrl+shift+l toggles between the two.
enabled_layouts     splits,stack
tab_bar_style       powerline
tab_powerline_style slanted

# ── Remote control ───────────────────────────────────────────────────────
# Off (kitty's default: allow_remote_control no, listen_on none). Nothing here
# needs it. Uncomment both lines to get `kitten @ …` from the shell and
# nvim↔kitty bridges (smart-splits, kitty-scrollback.nvim); socket-only keeps
# escape-code control from programs' output refused. Startup-only: needs a
# kitty restart, not ctrl+shift+f5. Prefer unix:${XDG_RUNTIME_DIR}/kitty over
# an abstract @socket if other users or Flatpak/Snap apps are a concern.
# allow_remote_control socket-only
# listen_on            unix:@kitty

# kitty phones GitHub every 24h to check for updates. Off, for the same reason
# the theme below is vendored rather than fetched.
update_check_interval 0

# ── Keys ─────────────────────────────────────────────────────────────────
# Shift+Enter → ESC CR so Claude Code and other REPLs insert a newline, same
# as alacritty. Note this shadows the kitty-keyboard-protocol encoding of
# shift+enter, so an nvim <S-CR> mapping won't fire; delete this line if you
# want the native key instead.
map shift+enter send_text all \x1b\r

map f11          toggle_fullscreen
# then / or ? to search
map ctrl+shift+f show_scrollback
# alacritty ClearHistory
map ctrl+shift+k clear_terminal scrollback active
# ctrl+shift+n (new OS window), ctrl+shift+c/v, ctrl+shift+e (open URL with
# hints) and ctrl+shift+u (unicode input) are kitty defaults.

# New splits and tabs start in the current directory.
map ctrl+shift+enter launch --cwd=current --location=split
map ctrl+shift+t     new_tab_with_cwd
map ctrl+alt+h       neighboring_window left
map ctrl+alt+j       neighboring_window down
map ctrl+alt+k       neighboring_window up
map ctrl+alt+l       neighboring_window right
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5

# ── Colours ──────────────────────────────────────────────────────────────
# Vendored copy of catppuccin/kitty's mocha.conf, provenance + licence in its
# header; the same palette alacritty.toml imports from its theme clone. Kept
# verbatim so re-vendoring is a diff — local taste goes BELOW the include,
# where later settings win.
include themes/catppuccin-mocha.conf
# upstream says `system` (GNOME's titlebar colour); match the terminal
# background instead so kitty's CSD titlebar doesn't sit as a light bar over a
# dark window. `background` tracks whatever theme is included above.
wayland_titlebar_color background
