# kitty — pinned to the same font and geometry as alacritty.toml, so the two
# terminals render the prompt identically. kitty does NOT read GNOME's
# monospace-font-name (step 55 sets that for the stock terminals); with no
# config it falls back to fontconfig's "monospace" — DejaVu Sans Mono — which
# has none of p10k's Nerd Font glyphs, so every icon was a box (found live on
# the Gen-3 clone, 2026-09-13). alacritty.toml never had this problem because
# it pins the family itself; this file does the same for kitty.
font_family      MesloLGS NF
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Same padding (x=8, y=6) and opacity as alacritty.toml. Two values = vertical,
# horizontal — CSS order.
window_padding_width 6 8
background_opacity   0.9

# No colour theme on purpose. alacritty's catppuccin_mocha comes from a cloned
# theme repo; kitty's equivalents are `kitten themes` (fetches from GitHub at
# run time — the mutable-upstream surface TODO J is about) or a vendored file.
# Left at kitty's default dark scheme until J settles how themes are pinned.
