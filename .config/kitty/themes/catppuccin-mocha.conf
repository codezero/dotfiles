# Catppuccin Mocha for kitty — VENDORED, verbatim below the line marked
# "# vim:ft=kitty". Data, not code, so it is copied in with provenance rather
# than pinned+fetched (see provision/pins.sh for the difference; the font in
# fonts/MesloLGS-NF/ is the precedent). kitty's own `kitten themes` would
# download this from GitHub at run time — exactly the mutable-upstream surface
# TODO J removed — and kitty.conf sets update_check_interval 0 for the same
# reason. The 16 ANSI colours, fg/bg, cursor and selection are the values in
# the alacritty theme clone's catppuccin_mocha.toml (alacritty-theme @
# ab88d5a), so both terminals render identically; the border/tab/mark/
# scrollbar entries are kitty-only. kitty.conf overrides wayland_titlebar_color
# after the include; nothing is edited here.
