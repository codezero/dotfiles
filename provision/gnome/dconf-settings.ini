# GNOME / dconf settings — curated portable defaults captured from the source box.
# Apply as the target user (a session bus is required — step 55 uses
# dbus-run-session when provisioning headlessly):  dconf load / < dconf-settings.ini
#
# Deliberately EXCLUDES machine/hardware state: monitor layout, window sizes,
# timestamps, run counts, MRU lists, wallpaper (left at the distro default).
# favorite-apps is kept for fidelity; GNOME silently ignores entries whose
# .desktop file isn't installed.

[org/gnome/desktop/interface]
accent-color='orange'
color-scheme='prefer-dark'
enable-hot-corners=true
gtk-theme='Yaru-dark'
icon-theme='Yaru-dark'
show-battery-percentage=true
# Step 36 installs MesloLGS NF system-wide, but nothing was USING it: GNOME's
# default monospace font is plain 'Monospace', so the stock terminal (Console /
# gnome-terminal, both of which follow this key) rendered p10k's glyphs as tofu
# while Alacritty looked right — alacritty.toml pins the family itself. Setting
# it here is one machine-agnostic key that fixes every stock GNOME app at once.
# Harmless if the font is missing: fontconfig just falls back. (Step 36 runs
# before step 55, so on a desktop run the font is always in place first.)
monospace-font-name='MesloLGS NF 11'

[org/gnome/desktop/input-sources]
sources=[('xkb', 'us'), ('xkb', 'tr')]
xkb-options=['grp_led:scroll']

[org/gnome/desktop/peripherals/touchpad]
two-finger-scrolling-enabled=true

[org/gnome/desktop/session]
idle-delay=uint32 180

[org/gnome/desktop/privacy]
report-technical-problems=false

[org/gnome/settings-daemon/plugins/power]
sleep-inactive-ac-timeout=3600
sleep-inactive-ac-type='nothing'

[org/gnome/settings-daemon/plugins/color]
night-light-schedule-automatic=false

[org/gnome/shell]
enabled-extensions=['ding@rastersoft.com', 'ubuntu-dock@ubuntu.com', 'tiling-assistant@ubuntu.com', 'snapd-search-provider@canonical.com', 'web-search-provider@ubuntu.com']
favorite-apps=['firefox_firefox.desktop', 'org.gnome.Nautilus.desktop', 'alacritty_alacritty.desktop', 'io.beekeeperstudio.Studio.desktop', 'thunderbird_thunderbird.desktop', 'org.chromium.Chromium.desktop', 'cursor.desktop', 'libreoffice-writer.desktop', 'org.gnome.Settings.desktop', 'org.gnome.Software.desktop', 'snap-store_snap-store.desktop', 'update-manager.desktop']

[org/gnome/shell/extensions/dash-to-dock]
dash-max-icon-size=30
multi-monitor=true

[org/gnome/shell/extensions/tiling-assistant]
focus-hint-color='rgb(203,67,20)'
tiling-popup-all-workspace=true
