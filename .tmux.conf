# ~/.tmux.conf — sane defaults for heavy TUI work (nvim, lazygit, k9s, btop,
# Claude Code). Alacritty has no tabs; tmux is the tabs/splits/persistence layer.

# Kill the 500ms escape delay that wrecks ESC / mode-switching in nvim & TUIs.
set -sg escape-time 10

# Truecolor: advertise a 256color terminfo inside, and tell tmux which OUTER
# terminals do 24-bit colour. tmux-256color avoids relying on the `alacritty`
# terminfo existing on remote boxes (it usually doesn't), so TUIs over SSH stay
# legible. terminal-features (tmux >= 3.2; apt ships 3.4, brew 3.7) replaced
# the alacritty-only terminal-overrides on 2026-09-13: kitty (xterm-kitty) is
# installed alongside since step 38 and tmux-in-kitty was falling back to 256
# colours (found on-box). Listed by name rather than `*` — the Linux console
# (TERM=linux) is not RGB and a wildcard would lie to it.
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty:RGB,xterm-kitty:RGB,xterm-256color:RGB"

# 1-based windows/panes (0 is at the far end of the keyboard); keep numbering
# gapless when a window closes.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Let TUIs see focus in/out (nvim autoread, etc.).
set -g focus-events on

# Mouse: scroll, select panes/windows, drag-resize.
set -g mouse on

# Big scrollback to match the terminal.
set -g history-limit 50000

# Pass escape sequences (e.g. OSC 52 clipboard) straight through to the
# terminal, so yanking in nvim / over SSH reaches the system clipboard via
# Alacritty's `osc52 = "OnlyCopy"`.
set -g allow-passthrough on

# vi-style keys in copy mode.
setw -g mode-keys vi

# Status bar — Catppuccin Mocha palette hardcoded (no theme plugin to fetch;
# same values as the kitty/alacritty themes). Session persistence (resurrect/
# continuum) was considered 2026-09-13 and deferred: two more pinned clones for
# a feature kitty's native tabs cover on the desktop.
set -g status-position top
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left " #S "
set -g status-left-style "bg=#89b4fa,fg=#1e1e2e,bold"
set -g status-right " #h  %H:%M "
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-current-style "bg=#45475a,fg=#cdd6f4,bold"
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"
